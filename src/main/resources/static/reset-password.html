<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>AnimeQuiz — redefinir senha</title><link rel="stylesheet" href="/reset-password.css"></head>
<body><main><p class="brand">ANIMEQUIZ</p><label for="language">Idioma / Language</label><select id="language"><option value="pt-BR">Português</option><option value="en">English</option></select>
<h1 id="title">Definir nova senha</h1><p id="intro">O link vale por 15 minutos e pode ser usado uma única vez.</p>
<form id="reset-form">
<label for="password" id="password-label">Nova senha</label><div class="field"><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
<button id="toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">◉</button></div>
<label for="confirm" id="confirm-label">Confirme a nova senha</label><input id="confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
<button id="submit" type="submit">Salvar nova senha</button>
</form><p id="status" role="status" aria-live="polite"></p><a id="again" href="/reset-password.html">Abrir página novamente</a>
</main><script src="/reset-password.js"></script></body></html>
