spring.application.name=animequiz-api

# H2 file database; production requires DB_URL on a persistent mounted disk
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/animequizdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console disabled by default
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=V1 - basica
springdoc.swagger-ui.urls[0].url=/api-docs/v1
springdoc.swagger-ui.urls[1].name=V2 - completa
springdoc.swagger-ui.urls[1].url=/api-docs/v2
springdoc.swagger-ui.urlsPrimaryName=V1 - basica
springdoc.swagger-ui.disable-swagger-default-url=true

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${JWT_ISSUER:animequiz-api}

# Render port
server.port=${PORT:8080}

# Recursos avancados - configuracao de demonstracao
# Defina CORS_ALLOWED_ORIGINS com as origens reais de qualquer frontend web.
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081}
api.rate-limit.requests=${RATE_LIMIT_REQUESTS:120}
api.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Durable file by default. On production DB_URL must point to a mounted persistent disk.
app.public-origin=${PUBLIC_APP_ORIGIN:}
google.client-ids=${GOOGLE_CLIENT_IDS:}
mail.api-key=${MAIL_API_KEY:}
mail.from=${MAIL_FROM:}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2200KB
app.catalog.seed-enabled=${CATALOG_SEED_ENABLED:true}
api.auth-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}

# Explicit operator bootstrap. Disable and remove its password after provisioning.
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:isaac@gmail.com}
app.admin-bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:isaac}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-bootstrap.update-existing=${ADMIN_BOOTSTRAP_UPDATE_EXISTING:false}
