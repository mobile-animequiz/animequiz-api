spring.application.name=animequiz-api

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:animequizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2: desabilitado por padrão; habilite apenas no desenvolvimento local.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Sem OSIV: o acesso ao banco fica restrito às camadas de serviço (@Transactional); controllers só veem DTOs.
spring.jpa.open-in-view=false

# OpenAPI / Swagger Path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# JWT: JWT_SECRET é obrigatório e deve ter pelo menos 32 bytes.
security.jwt.secret=${JWT_SECRET:AnimeQuizLocalDevSecretKey2026_123456789}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${JWT_ISSUER:animequiz-api}
