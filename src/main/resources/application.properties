spring.application.name=animequiz-api

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:animequizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console disabled by default
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${JWT_ISSUER:animequiz-api}

# Render port
server.port=${PORT:8080}

# Recursos avancados - configuracao de demonstracao
# Defina CORS_ALLOWED_ORIGINS com as origens reais de qualquer frontend web.
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081}
api.rate-limit.requests=${RATE_LIMIT_REQUESTS:120}
api.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
