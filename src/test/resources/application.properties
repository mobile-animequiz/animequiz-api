# Chave exclusiva dos testes automatizados; não reutilize em ambientes executáveis.
security.jwt.secret=animequiz-test-only-signing-key-32-bytes-minimum
spring.h2.console.enabled=false

# Este arquivo substitui o application.properties principal durante os testes.
# Crie o schema antes de carregar data.sql e mantenha o caminho OpenAPI do app.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# A suíte de contratos não deve esgotar o orçamento de requisições por IP.
api.rate-limit.requests=10000
